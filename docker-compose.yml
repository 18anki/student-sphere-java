version: '3.8'
services:
  mysql:
    image: mysql:8.0
    container_name: studentsphere-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: studentsphere
      MYSQL_USER: studentsphere_user
      MYSQL_PASSWORD: studentsphere_pass
    ports:
      - "3306:3306"
    volumes:
      - ./mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
