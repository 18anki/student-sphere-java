# MySQL profile for development
# Use: add --spring.profiles.active=mysql to enable
spring.datasource.url=jdbc:mysql://localhost:3306/studentsphere?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=studentsphere_user
spring.datasource.password=studentsphere_pass
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.show-sql=true

# H2 console disabled for MySQL profile
spring.h2.console.enabled=false
