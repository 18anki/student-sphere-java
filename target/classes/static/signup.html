<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Students Sphere</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container" style="max-width: 500px;">
        <div class="logo-container">
            <!-- Updated to match current filename -->
            <img src="images/logo.png.png" alt="Students Sphere Logo" class="logo">
        </div>
        <h2>Sign Up</h2>
        <form id="signUpForm">
            <!-- Personal Information -->
            <div class="form-group">
                <label for="fullName">Full Name</label>
                <input type="text" id="fullName" name="fullName" placeholder="Enter your full name" required>
            </div>

            <div class="form-group">
                <label for="email">Personal Email</label>
                <input type="email" id="email" name="email" placeholder="Enter your personal email" required>
            </div>

            <hr style="margin: 20px 0; border: 0; border-top: 1px solid #eee;">

            <!-- College Information -->
            <div class="form-group">
                <label for="state">College State</label>
                <select id="state" name="state" required>
                    <option value="">Loading...</option>
                </select>
            </div>

            <div class="form-group">
                <label for="city">College City</label>
                <select id="city" name="city" required disabled>
                    <option value="">Select State First</option>
                </select>
            </div>

            <div class="form-group">
                <label for="college">College Name</label>
                <select id="college" name="college" required disabled>
                    <option value="">Select City First</option>
                </select>
            </div>

            <div class="form-group">
                <label for="studentCollegeEmail">Student College Email</label>
                <input type="email" id="studentCollegeEmail" name="studentCollegeEmail" placeholder="e.g., student@college.edu" required>
                <small id="emailHint" style="color: #666; display: none; margin-top: 5px;"></small>
            </div>

            <hr style="margin: 20px 0; border: 0; border-top: 1px solid #eee;">

            <!-- Security -->
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Create a password" required>
            </div>

            <div class="form-group">
                <label for="confirmPassword">Confirm Password</label>
                <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Confirm your password" required>
            </div>

            <div id="message" class="error-message"></div>
            <div id="successMessage" class="success-message"></div>

            <button type="submit">Sign Up</button>
        </form>
        <div class="links">
            <a href="index.html">Already have an account? Sign In</a>
        </div>
    </div>
    <script src="js/auth.js"></script>
</body>
</html>
