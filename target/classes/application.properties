# Application Name
spring.application.name=StudentsSphere

# H2 Database Configuration (File-based Persistence)
# This will create a file named 'studentsphere_db.mv.db' in your project root
spring.datasource.url=jdbc:h2:file:./studentsphere_db;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# H2 Console (Access at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate
spring.jpa.show-sql=true
# 'update' keeps the data and updates the schema if code changes
spring.jpa.hibernate.ddl-auto=update

# JWT Configuration
# Secret key must be at least 256 bits (32 characters) for HS256
jwt.secret=5367566B59703373367639792F423F4528482B4D6251655468576D5A71347437
# Expiration time in milliseconds (e.g., 10 hours = 36000000)
jwt.expiration-ms=36000000
# Refresh token expiration time in milliseconds (e.g., 7 days = 604800000)
jwt.refresh-expiration-ms=604800000
